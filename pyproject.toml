[build-system]\nrequires = ["setuptools>=68.0"]\nbuild-backend = "setuptools.build_meta"\n\n[tool.setuptools.packages.find]\ninclude = ["sequoia_x*"]\n\n[project]\nname = "sequoia-x"\nversion = "2.0.0"\nrequires-python = ">=3.10"\ndependencies = [\n    \"akshare>=1.10\",\n    \"baostock>=0.9\",\n    \"pydantic-settings>=2.0\",\n    \"python-dotenv>=1.0\",\n    \"rich>=13.0\",\n    \"pandas>=2.0\",\n    \"requests>=2.31\",\n]\n\n[project.optional-dependencies]\ndev = [\n    \"pytest>=8.0\",\n    \"hypothesis>=6.100\",\n    \"pytest-mock>=3.12\",\n]\n\n[tool.ruff]\nline-length = 100\ntarget-version = \"py311\"\nselect = [\"E\", \"F\", \"I\", \"UP\"]\n\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\n